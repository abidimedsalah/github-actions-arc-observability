```yaml
name: ARC Local Test

on:
  workflow_dispatch:

jobs:
  arc-test:
    runs-on: demo-runner-set

    steps:
      - name: Runner information
        run: |
          echo "======================================"
          echo "        ARC RUNNER TEST"
          echo "======================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run ID:     $GITHUB_RUN_ID"
          echo "Job:        $GITHUB_JOB"
          echo "Runner:     $RUNNER_NAME"
          echo "OS:         $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo "Hostname:"
          hostname

      - name: Kubernetes runner test
        run: |
          echo "Running inside an ARC-managed Kubernetes runner"
          uname -a
          cat /etc/os-release

      - name: Simulate workload
        run: |
          echo "Starting workload..."
          sleep 60
          echo "Workload completed successfully"

      - name: Success
        run: |
          echo "======================================"
          echo "       ARC TEST PASSED"
          echo "======================================"
